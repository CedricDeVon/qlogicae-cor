[project]
name = "qlogicae-cor"
version = "3.0.0"
description = "The core library for QLogicae projects"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = [
    "LICENSE"
]
authors = [
    { name = "Vaughn Cedric L. Araneta", email = "vaughncedriclipardoaraneta@gmail.com" }
]
maintainers = [
    { name = "Vaughn Cedric L. Araneta", email = "vaughncedriclipardoaraneta@gmail.com" }
]
keywords = [
    "qlogicae",
    "cor"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pybenchmark",
    "ruff",
    "mypy",
    "hatch",
    "twine",
    "memray",
    "scalene",
    "pympler",
    "vulture",
    "bandit",
    "detect-secrets",
    "pip-audit",   
    "python-minifier"
]

[project.scripts]
qlogicae-cor = "qlogicae_cor.v3.app:main"

[project.urls]
Homepage = "https://github.com/CedricDeVon/qlogicae-cor"
Repository = "https://github.com/CedricDeVon/qlogicae-cor"
Documentation = "https://github.com/CedricDeVon/qlogicae-cor"
Issues = "https://github.com/CedricDeVon/qlogicae-cor/issues"
Changelog = "https://github.com/CedricDeVon/qlogicae-cor/releases"


[build-system]
requires = [
    "hatchling"
]
build-backend = "hatchling.build"


[tool.setuptools]
package-dir = {"" = "qlogicae_cor"}


[tool.setuptools.packages.find]
where = ["qlogicae_cor"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "./test/qlogicae_cor/v3/unit"
]
python_files = ["test_*.py"]
addopts = "-ra"


[tool.coverage.run]
source = [
    "qlogicae_cor.v3.library.singleton_manager",
    "qlogicae_cor.v3.library.macros_manager",
    "qlogicae_cor.v3.library.object_merge_manager",
    "qlogicae_cor.v3.library.value_cache_storage_manager",
]
branch = true


[tool.coverage.report]
show_missing = true
skip_covered = false


[tool.mypy]
files = ["qlogicae_cor/v2"]
strict = true
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
pretty = true
color_output = true
show_column_numbers = true
show_error_context = true


[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".output",
    "output",
    ".outputs",
    "outputs",
    ".dist",
    "dist",
    ".build",
    "build",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".tox",
    ".nox",
    ".idea",
    ".vscode",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
skip-magic-trailing-comma = false


[tool.ruff.lint]
select = [    
    "E",
    "W", # pycodestyle    
    "F", # Pyflakes    
    "I", # isort    
    "UP", # pyupgrade    
    "B", # flake8-bugbear
    "PTH", # pathlib
]
ignore = [    
    "S607",    
    "E731",
    "S101", # allow assert statements    
    "S603", # allow subprocess usage
    "PLR2004", # allow magic values
]
fixable = [
    "ALL"
]
unfixable = []


[tool.hatch.build]
include = [
    "qlogicae_cor/**/*.py",
    "qlogicae_cor/py.typed",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "test",
    ".github",
    ".gitignore",
    ".vscode",
    "requirements.txt",
    "output",
    "docs/**",
    "project/**",
]

[tool.hatch.build.targets.wheel.force-include]
"qlogicae_cor/py.typed" = "qlogicae_cor/py.typed"


[tool.hatch.build.targets.wheel]
packages = ["qlogicae_cor"]


[tool.hatch.envs.default.scripts]
test-check-and-apply-format = """
    ruff check qlogicae_cor/v3 --fix
"""

test-check-and-apply-lint = """
    mypy
"""

test-run-unit = """
    pytest -vv \
        --cov \
        --cov-branch \
        --cov-report=term-missing \
        --cov-report=html:\"output/test/unit/html\" \
        --cov-report=xml:\"output/test/unit/coverage.xml\" \
        --cov-report=json:\"output/test/unit/coverage.json\" \
        --junitxml=\"output/test/unit/junit.xml\" \
"""

test-run-smoke = """
    ./.venv/bin/python -m test.qlogicae_cor.v3.smoke.script
"""

test-run-e2e = """
    qlogicae-cor
"""

test-check-feature-staleness = """
    vulture qlogicae_cor 
"""

test-check-dependencies = """
    pip-audit -r requirements.txt
"""

test-check-hardcoded-secrets = """
    detect-secrets scan 
"""

test-check-security = """
    bandit -r qlogicae_cor
"""

test-check-pip-deployment-build = """
    twine check output/build/release/dist/*
"""

benchmark-create-memray-usage-import-only = """
    memray run -o output/benchmark/usage.import_only.bin -m test.qlogicae_cor.v3.benchmark.usage.import_only
"""

benchmark-view-memray-usage-import-only = """
    memray tree output/benchmark/usage.import_only.bin
"""

benchmark-create-memray-usage-import-and-allocate = """
    memray run -o output/benchmark/usage.import_and_allocate.bin -m test.qlogicae_cor.v3.benchmark.usage.import_and_allocate
"""

benchmark-view-memray-usage-import-and-allocate = """
    memray tree output/benchmark/usage.import_and_allocate.bin
"""

benchmark-short-library-import-memory-usage = """
    ./.venv/bin/python -m test.qlogicae_cor.v3.benchmark.tool \
        qlogicae_cor.v3 \
        --json-output output/benchmark/import-library-memory-usage.json \
        --repetitions 1
"""

benchmark-long-experiment-import-memory-usage = """
    ./.venv/bin/python -m test.qlogicae_cor.v3.benchmark.tool \
        test.qlogicae_cor.v3.benchmark.import_experiment.static_import \
        test.qlogicae_cor.v3.benchmark.import_experiment.old_dynamic_import \
        test.qlogicae_cor.v3.benchmark.import_experiment.typeless_with_static_class_import \
        test.qlogicae_cor.v3.benchmark.import_experiment.typeless_with_dynamic_class_import \
        test.qlogicae_cor.v3.benchmark.import_experiment.empty_package \
        --json-output output/benchmark/import-experiment-memory-usage.json/ \
        --repetitions 20
"""

benchmark-long-library-import-memory-usage = """
    ./.venv/bin/python -m test.qlogicae_cor.v3.benchmark.tool \
        qlogicae_cor.v1 \
        qlogicae_cor.v2 \
        qlogicae_cor.v3 \
        --json-output output/benchmark/import-library-memory-usage.json \
        --repetitions 20
"""

deploy-build-release = """
    twine upload output/build/release/dist/* --config-file .pypirc
"""

usage-install-release = """
    ./.venv/bin/python -m pip install --force-reinstall output/build/release/dist/*.whl
"""

usage-uninstall-release = """
    ./.venv/bin/python -m pip uninstall -y output/build/release/dist/*.whl
"""
