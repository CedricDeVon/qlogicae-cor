[package]
name = "${{ qlogicae-cor-base-brand-name }}"
version = "1.0.4"
edition = "2024"
authors = ["Vaughn Cedric L. Araneta"]
description = "The core library for QLogicae projects"
license = "MIT"
repository = "${{ qlogicae-cor-base-repository-link }}"
homepage = "${{ qlogicae-cor-base-repository-link }}"
documentation = "${{ qlogicae-cor-base-repository-link }}"
readme = "README.md"
keywords = ["qlogicae", "${{ qlogicae-cor-base-project-name }}"]
categories = ["development-tools"]
include = [
    "project/**",
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
]

[lib]
path = "src/lib.rs"

[dependencies]
