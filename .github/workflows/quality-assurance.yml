    typescript-unit-test:
      name: Typescript | Unit Test (${{ matrix.runtime }})
      runs-on: ubuntu-latest

      strategy:
        fail-fast: false
        matrix:
          runtime:
            - bun

      defaults:
        run:
          working-directory: ./typescript

      steps:
        - uses: actions/checkout@v4

        - run: sleep 20

        - if: matrix.runtime == 'bun'
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest

        - if: matrix.runtime == 'bun'
          run: bun install --frozen-lockfile

        - if: matrix.runtime == 'bun'
          run: bun run workflow:test:unit

    typescript-e2e-test:
      name: Typescript | V1 | E2E (${{ matrix.package_manager }}${{ matrix.node_version && format(' / Node {0}', matrix.node_version) || '' }})
      runs-on: ubuntu-latest

      strategy:
        fail-fast: false
        matrix:
          include:
            - package_manager: bun
              node_version: 22

            - package_manager: bun
              node_version: 24

      defaults:
        run:
          working-directory: ./typescript/test/e2e/v1

      steps:
        - uses: actions/checkout@v4

        - run: sleep 20

        - if: matrix.package_manager == 'bun'
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest

        - if: matrix.package_manager != 'bun'
          uses: actions/setup-node@v4
          with:
            node-version: ${{ matrix.node_version }}

        - if: matrix.package_manager == 'bun'
          run: bun add qlogicae-cor@latest

        - if: matrix.package_manager == 'bun'
          run: |
            bunx qlogicae-cor
            bun usage.ts
  
    typescript-install:
        name: Typescript | Install via ${{ matrix.package_manager }} on Node ${{ matrix.node_version }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                node_version: [22, 24]
                package_manager:
                    - npm
                    - pnpm
                    - yarn
                    - bun

        steps:
            - run: sleep 20

            - if: matrix.package_manager == 'npm'
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node_version }}

            - if: matrix.package_manager == 'pnpm'
              uses: pnpm/action-setup@v4
              with:
                  version: latest

            - if: matrix.package_manager == 'pnpm'
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node_version }}

            - if: matrix.package_manager == 'yarn'
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node_version }}

            - if: matrix.package_manager == 'bun'
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - if: matrix.package_manager == 'npm'
              run: npm install qlogicae-cor1@latest

            - if: matrix.package_manager == 'pnpm'
              run: pnpm add qlogicae-cor1@latest

            - if: matrix.package_manager == 'yarn'
              run: yarn add qlogicae-cor1@latest

            - if: matrix.package_manager == 'bun'
              run: bun add qlogicae-cor1@latest
